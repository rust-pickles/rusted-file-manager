[package]
name = "rusted-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri 2 desktop shell hosting the RUSTED React frontend"

# The shell is a thin adapter: it owns windowing, IPC surface and DTO mapping and
# delegates every filesystem decision to the backend crates. It deliberately has
# no business logic of its own so the crates stay usable without a webview.
[lib]
name = "rusted_shell"
# ""rlib"" is deliberately absent: the package also has a bin target with the same
# name, and an rlib makes Cargo warn about a colliding .pdb on Windows. Tauri only
# needs the staticlib (desktop) and cdylib (mobile) forms.
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true

# Backend crates. Only those the DTO layer actually maps are pulled in today;
# the remaining ones (search, db, archives, storage) are added when their
# commands land, so the shell never links code it does not expose.
rusted-core.workspace = true
rusted-fs.workspace = true
