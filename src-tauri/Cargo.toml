[package]
name = "rusted-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri 2 desktop shell hosting the RUSTED React frontend"

# The shell is a thin adapter: it owns windowing, IPC surface and DTO mapping and
# delegates every filesystem decision to the backend crates. It deliberately has
# no business logic of its own so the crates stay usable without a webview.
[lib]
# The lib is named *_lib on purpose (the Tauri 2 template convention). The bin
# target is `rusted-shell`, and Cargo maps dashes to underscores when naming
# artifacts, so a lib called `rusted_shell` collides with the binary and makes
# every Windows build warn about a shared .pdb. A distinct name removes the
# collision without dropping any crate type.
#
# All three types are needed and none is optional:
#   staticlib - what the desktop binary links against
#   cdylib    - what the mobile entry point loads
#   rlib      - what main.rs and the unit tests link against
name = "rusted_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true

# Backend crates. Only those the DTO layer actually maps are pulled in today;
# the remaining ones (search, db, archives, storage) are added when their
# commands land, so the shell never links code it does not expose.
rusted-core.workspace = true
rusted-fs.workspace = true
