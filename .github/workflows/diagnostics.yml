name: diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["arena/280b8b98-rusted-file-manager"]

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "4"

jobs:
  windows:
    # Windows 11 x64 is the shipping target; this is the real platform check.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rusted-windows
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
      - name: Check workspace
        shell: pwsh
        run: |
          cargo check --workspace --all-targets 2>&1 | Tee-Object -FilePath check.log
          "check_exit=$LASTEXITCODE" | Tee-Object -FilePath check.log -Append
          exit 0
      - name: Publish check diagnostics
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = "Run ${{ github.run_id }} on ${{ github.sha }} (check)`n`n"
          if (Test-Path check.log) {
            $text = Get-Content check.log -Raw
            if ($text.Length -gt 60000) { $text = $text.Substring($text.Length - 60000) }
            $body += "``````n$text`n``````n"
          }
          Set-Content -Path check-comment.md -Value $body -Encoding utf8
          gh issue comment 1 --repo ${{ github.repository }} --body-file check-comment.md
      - name: Test workspace
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath test.log
          "test_exit=$LASTEXITCODE" | Tee-Object -FilePath test.log -Append
          exit 0
      - name: Publish test diagnostics
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = "Run ${{ github.run_id }} on ${{ github.sha }} (test)`n`n"
          if (Test-Path test.log) {
            $text = Get-Content test.log -Raw
            if ($text.Length -gt 60000) { $text = $text.Substring($text.Length - 60000) }
            $body += "``````n$text`n``````n"
          }
          Set-Content -Path test-comment.md -Value $body -Encoding utf8
          gh issue comment 1 --repo ${{ github.repository }} --body-file test-comment.md
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: "*.log"
